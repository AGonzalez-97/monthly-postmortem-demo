<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postmortem mensual de campañas — Demo visual (datos ficticios)</title>
<style>

  --sb:#0C1E3D;--sba:#5B4FCF;--sbt:#CBD3E8;--sbm:#7C88A8;--gbg:#DCFCE7;--gfg:#166534;--ybg:#FEF3C7;--yfg:#92400E;--rbg:#FEE2E2;--rfg:#991B1B;--nbg:#F3F4F6;--nfg:#6B7280;
}
[data-theme="dark"]{
  --bg:#0E1526;--sf:#161F38;--sf2:#1C2744;--bd:#2B3A5E;--tx:#E7E9F2;--mu:#99A3BE;--pr:#8176E8;--prh:#9A90EF;--dg:#E0564A;--ok:#3CC48A;--wn:#F0B429;--inf:#6FA8FF;--sel:#2E2960;
  --sb:#070D1C;--sba:#8176E8;--sbt:#CBD3E8;--sbm:#6E7FA3;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 var(--f);background:var(--bg);color:var(--tx);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.mu{color:var(--mu)}.sm{font-size:11px}.b{font-weight:700}.mono{font-family:var(--fm)}
#strip{height:28px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#5B4FCF,#0C9A82);color:#fff;font-weight:600;font-size:12px;padding:0 10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app{display:grid;grid-template-columns:250px minmax(0,1fr);height:calc(100vh - 28px)}
#sb{background:var(--sb);color:var(--sbt);display:flex;flex-direction:column;padding:20px 12px 14px;gap:2px;overflow:auto;min-height:0}
.brand{padding:2px 10px 16px}.brand .t{font:800 21px var(--fh);color:#fff;letter-spacing:.2px}.brand .s{font-size:11px;color:var(--sbm);margin-top:2px}
.cap{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--sbm);padding:14px 12px 4px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;cursor:pointer;font-size:13px;user-select:none;color:var(--sbt)}
.ni:hover{background:rgba(255,255,255,.08)}.ni.on{background:var(--sba);color:#fff;font-weight:700}
.ni .ic{width:18px;text-align:center}.ni .ic:empty{display:none}
.sbf{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 6px 0}
.sbf button{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--sbt);padding:7px 10px;border-radius:7px;cursor:pointer;text-align:left}
.sbf button:hover{background:rgba(255,255,255,.08)}.sbf .v{font-size:11px;color:var(--sbm);padding-left:4px}
#ct{overflow:auto;padding:26px 28px 36px;min-width:0;position:relative}
h1.pg{font:800 24px var(--fh);margin:0 0 2px}h2.sh{font:800 15px var(--fh);margin:0}
.sub{color:var(--mu);margin:0 0 16px}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.chd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.btn{background:var(--sf);border:1px solid var(--bd);padding:7px 14px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sf2)}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:700}.btn.p:hover:not(:disabled){background:var(--prh)}
.btn.d{border-color:var(--dg);color:var(--dg)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.s{padding:3px 10px;font-size:11px}
.gb{border:1px solid var(--bd);background:var(--sf2);padding:3px 11px;border-radius:999px;font-size:11px;cursor:pointer;color:var(--mu)}
.gb.on{background:var(--sel);color:var(--pr);border-color:var(--pr);font-weight:700}
.tile{border:1px solid var(--bd);border-radius:8px;padding:5px 14px;cursor:pointer;min-width:130px;background:var(--sf)}
.tile .n{font:800 19px var(--fh);line-height:1.1}.tile .l{font-size:11px;color:var(--mu)}
.tile.pe .n{color:var(--dg)}.tile.en .n{color:var(--ok)}.tile.on{outline:2px solid var(--pr);outline-offset:-1px}
.ck{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-right:14px}
.fld{display:flex;align-items:center;gap:8px}
select,input[type=text],input[type=password],input[type=number],textarea{background:var(--sf);border:1px solid var(--bd);padding:6px 9px;border-radius:7px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}
.cg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-top:6px}
.cc{border:1px solid var(--bd);border-radius:10px;background:var(--sf);display:flex;flex-direction:column;position:relative}
.cc.on{border-color:var(--pr);outline:2px solid var(--pr);outline-offset:-1px;background:var(--sel)}
.idn{cursor:pointer;border-radius:10px 10px 0 0}
.bn{height:56px;background:#fff;display:flex;align-items:center;justify-content:center;border-radius:10px 10px 0 0;position:relative}
.logo{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:800 15px var(--fh)}
.dot{position:absolute;left:50%;bottom:-8px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--sf);z-index:2}
.dot.g{background:var(--ok)}.dot.y{background:#F0B429}.dot.r{background:var(--dg)}.dot.n{background:#9AA0AA}
.dot.b{animation:blk 1.1s steps(1) infinite}
@keyframes blk{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.dot.b{animation:none}}
.nm{height:2.9em;text-align:center;font:800 14px/1.2 var(--fh);padding:14px 8px 0}
.pl{text-align:center;color:var(--mu);font-size:11px;margin-bottom:6px}
.cb{padding:6px 12px 12px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.kv{display:flex;justify-content:space-between;gap:6px}.kv b{font-weight:700}
.wl{display:flex;gap:2px;justify-content:space-between}
.wl span{flex:1;text-align:center;font-weight:700;border-radius:4px;padding:1px 0;font-size:11px;cursor:default}
.w1{background:var(--sel);color:var(--pr)}.w0{color:var(--mu);opacity:.55}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--sf);padding:3px 9px;font-size:11px;cursor:pointer;border-right:1px solid var(--bd)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--pr);color:#fff;font-weight:700}.seg button:disabled{opacity:.4;cursor:not-allowed}
.rb{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;min-height:20px}
.rb.run{background:var(--ybg);color:var(--yfg)}.rb.ok{background:var(--gbg);color:var(--gfg)}.rb.er{background:var(--rbg);color:var(--rfg)}.rb.st{background:var(--ybg);color:var(--yfg)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--bd);margin-bottom:12px}
.tabs button{padding:8px 16px;border:0;border-bottom:3px solid transparent;background:transparent;cursor:pointer;color:var(--mu);font-weight:600}
.tabs button.on{color:var(--pr);border-bottom-color:var(--pr)}
.tw{overflow:auto;max-width:100%;border:1px solid var(--bd);border-radius:8px}
table.xt{border-collapse:collapse;font-size:11px;white-space:nowrap}
table.xt th,table.xt td{border:1px solid var(--bd);padding:3px 8px;text-align:right}
table.xt th{background:var(--sf2);font-weight:700;text-align:center;position:sticky;top:0;z-index:2}
table.xt tr.band th{background:var(--pr);color:#fff;top:0}
table.xt tr.cols th{top:24px}
table.xt td.c1,table.xt th.c1{position:sticky;left:0;z-index:1;background:var(--sf2);text-align:left;min-width:84px}
table.xt td.c2,table.xt th.c2{position:sticky;left:84px;z-index:1;background:var(--sf2);text-align:left;min-width:110px}
table.xt th.c1,table.xt th.c2{z-index:3}
td.g{background:var(--gbg);color:var(--gfg)}td.y{background:var(--ybg);color:var(--yfg)}td.r{background:var(--rbg);color:var(--rfg)}
table.fm{border-collapse:collapse;width:100%}table.fm th,table.fm td{border-bottom:1px solid var(--bd);padding:7px 10px;text-align:left;vertical-align:top}
table.fm th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.ori{font-style:italic;font-weight:800}.ori.L{color:var(--inf)}.ori.I{color:var(--ok)}.ori.C{color:var(--wn)}.ori.O{color:var(--pr)}
.frm{display:grid;grid-template-columns:230px minmax(0,460px);gap:10px 12px;align-items:center}
.frm input[type=text],.frm input[type=password],.frm input[type=number],.frm select{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.help{font-size:11px;color:var(--mu);margin:4px 0 8px}
.tb{width:760px;max-width:100%;border:1px solid var(--bd);padding:14px;font-family:var(--f)}
.tb h3{margin:0;font:800 18px var(--fh)}.tb .ts{font-size:11px;margin-bottom:10px}
.tb .kc{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.tb .k{border-radius:4px;padding:6px 8px}.tb .k .l{font-size:10px;opacity:.85}.tb .k .v{font:800 16px var(--fh)}
.tb table{border-collapse:collapse;width:100%;font-size:10.5px}.tb th,.tb td{padding:2px 6px;text-align:center}
.tb th{color:#fff}
.cl{border:2px solid var(--bd);border-radius:8px;margin-bottom:14px;overflow:hidden}.cl .cht{color:#fff;font-weight:700;padding:6px 12px}.cl .cli{display:flex;gap:10px;align-items:flex-start;padding:6px 12px;border-top:1px solid var(--bd)}
.bdg{color:#fff;font-weight:700;font-size:10px;padding:1px 6px;min-width:84px;text-align:center;flex:none;border-radius:3px}
.mail{border:1px solid var(--bd);border-radius:8px;padding:14px;background:var(--sf)}
.mail .h{display:grid;grid-template-columns:70px 1fr;gap:3px 10px;margin-bottom:10px}
#tip{position:fixed;z-index:80;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;font-size:11px;max-width:300px;display:none;pointer-events:none}
#tip .tt{font-weight:800;margin:6px 0 2px;color:var(--pr)}#tip .tt:first-child{margin-top:0}
#tip .tr{display:flex;justify-content:space-between;gap:14px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 18px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;max-width:80vw;text-align:center}
#toast.on{opacity:.96}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:70}
#modal.on{display:flex}
#modal .box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:18px;min-width:320px;max-width:min(820px,94vw);max-height:90vh;overflow:auto}
#modal h3{margin:0 0 8px;font:800 16px var(--fh)}
.cal{display:grid;grid-template-columns:repeat(7,38px);gap:3px;margin:10px 0}
.cal button{height:32px;border:1px solid var(--bd);background:var(--sf);border-radius:6px;cursor:pointer}
.cal button:disabled{opacity:.35;cursor:not-allowed}.cal button.on{background:var(--pr);color:#fff;border-color:var(--pr)}.cal .h{text-align:center;font-size:10px;font-weight:700;color:var(--mu);line-height:32px}
#logb{flex:1;overflow:auto;padding:8px 12px;font:11px/1.55 var(--fm)}
#logb .t{color:#7C88A8}#logb .step{color:#6FA8FF}#logb .ok{color:#3CC48A}#logb .wn{color:#F0B429}#logb .er{color:#E0564A;font-weight:700}
.empty{padding:34px 10px;text-align:center;color:var(--mu)}
#mbar{display:none}
@media (max-width:1250px){.cg{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2,.frm{grid-template-columns:1fr}}
@media (max-width:960px){
  #app{grid-template-columns:minmax(0,1fr)}
  #sb{position:fixed;left:0;top:28px;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s}
  #sb.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  #mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;padding:8px 14px;background:var(--bg,#F5F3EE);border-bottom:1px solid var(--bd,#ddd)}
  #mbar .btn{padding:8px 14px;font-weight:700}
  .cg{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){.cg{grid-template-columns:1fr}#ct{padding:18px 14px}.tb .kc{grid-template-columns:repeat(3,1fr)}.tb{padding:10px}}

#dock{margin-top:14px;flex:1;min-height:130px;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.16);border-radius:8px;overflow:hidden;background:#08122A}
#dock.col{flex:none;min-height:0}#dock.col #logb{display:none}
#dock .dh{display:flex;flex-direction:column;gap:6px;padding:8px 9px;border-bottom:1px solid rgba(255,255,255,.16);font-size:11px;font-weight:700;color:#fff}
#dock.col .dh{border-bottom:0}
#dock .dbs{display:flex;gap:4px;align-items:center}
#dock .dh select,#dock .dh button{font-size:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#CBD3E8;border-radius:5px;padding:2px 6px;cursor:pointer}
#dock .dh select{flex:1;min-width:0}#dock .dh select option{color:#1A2436}
#logb{flex:1;overflow:auto;padding:7px 9px;font:10.5px/1.5 var(--fm);word-break:break-word}
#logb .t{color:#7C88A8}#logb .step{color:#8FB5FF}#logb .ok{color:#3CC48A}#logb .wn{color:#F0B429}#logb .er{color:#FF7B6F;font-weight:700}

.sec{font-weight:800;margin:14px 0 4px}
</style>
</head>
<body>
<div id="strip">Demo visual con datos ficticios — ningún número, nombre o identificador de esta página corresponde a un cliente, campaña o sistema real.</div>
<div id="app">
  <aside id="sb">
    <div class="brand"><div class="t">Postmortem Hub</div><div class="s">Reportes de cierre</div></div>
    <div id="nav"></div>
    <div id="dock"><div class="dh"><span>Registro de actividad</span><span class="dbs"><select data-chg="lvl" aria-label="Nivel del registro"><option value="all">Todo</option><option value="wn">Avisos y errores</option></select><button data-act="logclr">Limpiar</button><button data-act="logcp">Copiar</button></span></div><div id="logb"></div></div>
    <div class="sbf">
      <button data-act="theme" id="thb">Modo oscuro</button>
      <div class="v" id="ver"></div>
    </div>
  </aside>
  <div id="mbar"><button class="btn" id="burger" data-act="burger" aria-label="Abrir menú y registro de actividad" aria-expanded="false">☰ Menú</button><span class="mu">Postmortem Hub</span></div>
  <main id="ct"></main>
</div>
<div id="tip"></div>
<div id="toast" role="status"></div>
<div id="modal"><div class="box" id="mbox"></div></div>

<script>
(function () {
"use strict";

/* ===================== Utilidades ===================== */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const nf = (v, d) => (v == null || !isFinite(v)) ? "—" : Number(v).toFixed(d).replace(".", ",");
const pc = (v) => (v == null || !isFinite(v)) ? "—" : nf(v * 100, 2) + "%";
const mmss = (s) => { if (s == null || !isFinite(s)) return "—"; s = Math.round(s); return Math.floor(s / 60) + ":" + pad(s % 60); };
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hs(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const DOW = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const MES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const fdate = (d) => pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
const today = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };
const isOp = (d) => { const w = d.getDay(); return w !== 0 && w !== 6; };
function lastOp() { const d = today(); d.setDate(d.getDate() - 1); while (!isOp(d)) d.setDate(d.getDate() - 1); return d; }
function opMinus(d, n) { const x = new Date(d); while (n > 0) { x.setDate(x.getDate() - 1); if (isOp(x)) n--; } return x; }
function opDiff(target, d) { let n = 0; const x = new Date(d); while (x < target && fdate(x) !== fdate(target)) { x.setDate(x.getDate() + 1); if (isOp(x)) n++; } return n; }
const mixc = (hex, w) => { const h = hex.replace("#", ""), c = [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16)); return "#" + c.map((v) => pad(Math.round(v + (255 - v) * w).toString(16))).join(""); };
const darkc = (hex, k) => { const h = hex.replace("#", ""), c = [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16)); return "#" + c.map((v) => pad(Math.round(v * k).toString(16))).join(""); };
const hsl2hex = (h, s, l) => { s /= 100; l /= 100; const a = s * Math.min(l, 1 - l), f = (n) => { const k = (n + h / 30) % 12, c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return pad(Math.round(255 * c).toString(16)); }; return "#" + f(0) + f(8) + f(4); };

/* ===================== Definiciones estáticas ===================== */
const VER = "v1.0-demo";
const CAMPS = {
  A: { name: "Campaña A", grp: 1, type: "front", plat: "Central tipo nube", hue: 215, svc: 10, aht: 480, lobs: ["Ventas", "Soporte", "Retención", "Cobranza"], conns: ["SQL", "Red", "Local"], lag: 0, sent: 0, sat: true },
  B: { name: "Campaña B", grp: 1, type: "front", plat: "Central tipo nube", hue: 160, svc: 10, aht: 420, lobs: ["Consultas", "Reclamos", "Soporte"], conns: ["SQL", "Red", "Local"], lag: 1, sent: 1 },
  C: { name: "Campaña C", grp: 2, type: "front", plat: "Central tipo nube", hue: 28, svc: 30, aht: 540, lobs: ["Ventas", "Postventa", "Reclamos", "Soporte", "Mesa"], conns: ["SQL", "Red"], lag: 2, sent: 1, sat: true, modes: true },
  D: { name: "Campaña D", grp: 1, type: "rrss", plat: "Redes sociales · tickets", hue: 280, svc: 180, aht: 600, lobs: ["Cerradas Norte", "Cerradas Sur"], conns: ["Red", "Local"], lag: 3, sent: 1 },
  E: { name: "Campaña E", grp: 1, type: "pne", plat: "Postventa · tickets", hue: 340, svc: 180, aht: 660, lobs: ["Postventa"], conns: ["Red", "Local"], lag: 0, sent: 0 },
  F: { name: "Campaña F", grp: 2, type: "front", plat: "Central tipo on-premise", hue: 190, svc: 20, aht: 360, lobs: ["Entrada", "Salida"], conns: ["SQL", "Local"], lag: 1, sent: 2 },
  G: { name: "Campaña G", grp: 2, type: "front", plat: "Central tipo nube", hue: 45, svc: 30, aht: 510, lobs: ["Mesa 1", "Mesa 2", "Ventas", "Soporte", "Reclamos", "Retención"], conns: ["SQL", "Red", "Local"], lag: 2, sent: 2, sat: true, modes: true },
  H: { name: "Campaña H", grp: 2, type: "front", plat: "Central tipo on-premise", hue: 95, svc: 30, aht: 450, lobs: ["Multiproducto 1", "Multiproducto 2", "Multiproducto 3", "Soporte", "Cobranza", "Mesa"], conns: ["SQL", "Red", "Local"], lag: 4, sent: 3, noRoster: true }
};
CAMPS.A.brand = hsl2hex(215, 62, 42); Object.keys(CAMPS).forEach((k) => { CAMPS[k].brand = hsl2hex(CAMPS[k].hue, 62, 40); CAMPS[k].ini = "C" + k; });
const WDL = [["L", 1], ["m", 2], ["M", 3], ["J", 4], ["V", 5], ["S", 6], ["D", 0]];

  const ids = Object.keys(S.res), r = S.res[id], sent = S.sd[id] && fdate(S.sd[id]) === fdate(r.date);
  const sel = '<select data-chg="dcamp" aria-label="Campaña">' + ids.map((x) => '<option value="' + x + '"' + (x === id ? " selected" : "") + ">" + esc(CAMPS[x].name) + "</option>").join("") + "</select>";
  return '<h3>Borrador de correo</h3><div class="row">' + sel + "</div>" + mailHTML(id, r, true) + '<div class="help">Después de enviar el borrador desde su cliente de correo, «Enviado hasta» se actualiza. En la demo puede simularlo con el botón de abajo.</div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeM">Cerrar</button><button class="btn p" data-act="sent" data-id="' + id + '"' + (sent ? " disabled" : "") + ">" + (sent ? "Ya figura como enviado" : "Simular envío manual") + "</button></div>";
}
function mapHTML(id) {
  const p = P[id], opts = (cur) => p.lobs.map((l) => "<option" + (cur === l ? " selected" : "") + ">" + esc(l) + "</option>").join("") + '<option value="__none__">— no cuenta —</option>';
  return "<h3>Mapeo de roster → LOB</h3><p class=\"help\">Asigna cada grupo del roster al LOB de la campaña " + esc(CAMPS[id].name) + ".</p><table class=\"fm\"><thead><tr><th>Grupo del roster</th><th>LOB</th></tr></thead><tbody>" + Object.keys(p.rmap).map((g) => "<tr><td>" + esc(g) + '</td><td><select data-rm="' + esc(g) + '">' + opts(p.rmap[g]) + "</select></td></tr>").join("") + '</tbody></table><div class="row" style="justify-content:flex-end"><button class="btn p" data-act="closeM">Listo</button></div>';
}
function reprocHTML(id) {
  return "<h3>Cambió un parámetro de cálculo</h3><p>Los días ya calculados de " + esc(CAMPS[id].name) + ' se calcularon con la configuración anterior. ¿Reprocesarlos ahora?</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeM">Ahora no</button><button class="btn p" data-act="reprocyes" data-id="' + id + '">Reprocesar</button></div>';
}
function weekTip(id, wd) {
  const t = today(), cur = (t.getDay() + 6) % 7, tg = (wd + 6) % 7, p = P[id];
  const sec = (off, title) => {
    const d = new Date(t); d.setDate(t.getDate() - cur + tg + off * 7); const past = d < t && fdate(d) !== fdate(t);
    return '<div class="tt">' + title + " · " + fdate(d) + "</div>" + p.lobs.map((l, li) => { const h = schedFor(id, li, wd); return '<div class="tr"><span>' + esc(l) + "</span><span>" + (h || (past ? "no trabajó" : "sin datos todavía")) + "</span></div>"; }).join("");
  };
  return sec(-1, "Semana −1") + sec(0, "Semana actual");
}


/* ===================== Cáscara y registro ===================== */
function render() {
  document.documentElement.setAttribute("data-theme", S.theme);
  $("#nav").innerHTML = NAVS.map((g) => (g[0] ? '<div class="cap">' + g[0] + "</div>" : "") + g[1].map((n) => '<div class="ni' + (S.view === n[0] ? " on" : "") + '" data-act="nav" data-v="' + n[0] + '" role="button" tabindex="0"><span class="ic">' + n[1] + "</span><span>" + n[2] + "</span></div>").join("")).join("");
  $("#thb").textContent = S.theme === "dark" ? "Modo claro" : "Modo oscuro"; $("#ver").textContent = VER;
  const ct = $("#ct"), top = ct.scrollTop, fn = { hub: viewHub, params: viewParams, config: viewConfig, news: viewNews, about: viewAbout }[S.view];
  try { ct.innerHTML = fn(); } catch (e) { ct.innerHTML = '<div class="cd"><b>No se pudo abrir.</b> ' + esc(e && e.name) + " — ver el registro.</div>"; logLine("er", "Error al dibujar la vista: " + (e && e.message)); }
  ct.scrollTop = top; $("#dock").classList.toggle("col", !S.logOpen);
}
function renderLog() {
  const b = $("#logb"), rows = S.logs.filter((l) => S.lvl === "all" || l.type === "wn" || l.type === "er");
  b.innerHTML = rows.length ? rows.map((l) => '<div><span class="t">' + l.t + '</span> <span class="' + l.type + '">' + esc(l.msg) + "</span></div>").join("") : '<div class="t">Sin registros para mostrar.</div>'; b.scrollTop = b.scrollHeight;
}
function logLine(type, msg) {
  const n = new Date(); S.logs.push({ t: pad(n.getHours()) + ":" + pad(n.getMinutes()) + ":" + pad(n.getSeconds()), type: type, msg: msg }); if (S.logs.length > 300) S.logs.shift(); renderLog();
}
let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }
function setPath(obj, path, val) { let o = obj; for (let i = 0; i < path.length - 1; i++) { if (o[path[i]] == null || typeof o[path[i]] !== "object") o[path[i]] = {}; o = o[path[i]]; } o[path[path.length - 1]] = val; }

/* ===================== Procesos simulados ===================== */
function consultar(quiet) {
  const tg = lastOp(); S.consulted = true;
  Object.keys(CAMPS).forEach((id) => { const C = CAMPS[id]; if (!S.dd[id]) S.dd[id] = opMinus(tg, C.lag); if (!S.sd[id]) S.sd[id] = opMinus(tg, C.lag + C.sent); });
  logLine("step", "Consultando «Datos hasta» de " + Object.keys(CAMPS).length + " campañas…"); logLine("ok", "Semáforo actualizado respecto del último día operativo (" + fdate(tg) + ").");
  if (!quiet) toast("Datos consultados."); render();
}
function procesar(ids) {
  const sel = ids || Object.keys(CAMPS).filter((id) => S.sel[id] && S.grp[CAMPS[id].grp]);
  if (!sel.length) { toast("Sin selección: haga clic en una o más campañas."); logLine("wn", "Procesar sin campañas seleccionadas."); return; }
  if (S.busy) return;
  S.busy = true; sel.forEach((id) => { S.run[id] = "run"; }); render(); let t = 0;
  sel.forEach((id) => {
    const C = CAMPS[id], p = P[id], L = (ms, type, msg) => setTimeout(() => logLine(type, msg), t + ms);
    L(0, "step", C.name + ": iniciando procesamiento del " + fdate(S.date));
    L(250, "info", "Conexión: " + p.conn + (C.modes ? " · modo " + (p.mode === "inter" ? "interacciones + línea de tiempo" : "crudo clásico") : ""));
    L(550, "step", "Ingesta: leyendo crudos de interacciones y estados de agente…");
    if (C.noRoster) { L(900, "er", "Roster vacío para la campaña y la semana pedidas: se corta antes de calcular."); const tt0 = t; setTimeout(() => { S.run[id] = "er"; S.run[id + "_msg"] = "No hay agentes en el roster para la campaña y la semana pedidas."; render(); }, tt0 + 1000); t += 1100; return; }
    L(900, "info", "Plan de dotación (OU) cargado: 26 franjas · " + p.lobs.length + " LOB");
    L(1200, "step", "Cálculo: razón de sumas por fecha × LOB…");
    const t0 = t;
    setTimeout(() => { const r = buildResult(id, S.date); S.res[id] = r; S.rcamp = id; S.run[id] = "ok"; delete S.run[id + "_msg"]; S.dd[id] = new Date(S.date); logLine("ok", "Excel generado: MES (" + r.mes.length + " filas) y DIA (" + r.dia.length + " filas)."); logLine("ok", "Tablero Delivery generado (PNG)."); logLine("ok", "Borrador de correo preparado: no se envía solo."); render(); }, t0 + 1500);
    t += 1800;
  });
  setTimeout(() => { S.busy = false; render(); toast("Procesamiento terminado."); }, t + 100);
}
function reprocesar(id) {
  if (!S.res[id]) { procesar([id]); return; }
  S.res[id] = buildResult(id, S.res[id].date); logLine("ok", CAMPS[id].name + ": reprocesado con los parámetros actuales."); toast("Reprocesado."); render();
}

/* ===================== Acciones ===================== */
function moveMonth(dir) {
  const d = new Date(S.date), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + dir); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  const lim = lastOp(); S.date = d > lim ? lim : d; render();
}
function act(a, el) {
  const v = el.dataset ? el.dataset.v : "", id = el.dataset ? el.dataset.id : "", p = P[S.pcamp];
  switch (a) {
    case "nav": S.view = v; S.pmsg = ""; render(); $("#ct").scrollTop = 0; $("#sb").classList.remove("open"); break;
    case "burger": { const o = $("#sb").classList.toggle("open"); $("#burger").setAttribute("aria-expanded", o); break; }
    case "theme": S.theme = S.theme === "dark" ? "light" : "dark"; render(); break;
    case "log": S.logOpen = !S.logOpen; render(); break;
    case "logclr": S.logs = []; renderLog(); break;
    case "logcp": try { if (navigator.clipboard) navigator.clipboard.writeText(S.logs.map((l) => l.t + " " + l.msg).join("\n")); } catch (e) { /* sin portapapeles */ } toast("Registro copiado al portapapeles."); break;
    case "grp": if (S.grp[v] && !S.grp[v === "1" ? 2 : 1]) { toast("Debe quedar al menos un grupo activo."); break; } S.grp[v] = !S.grp[v]; render(); break;
    case "filt": S.filt = S.filt === v ? "all" : v; render(); break;
    case "sel": S.sel[id] = !S.sel[id]; render(); break;
    case "selall": { const vis = visCamps(); vis.forEach((x) => { S.sel[x] = el.checked; }); render(); break; }
    case "consult": consultar(); break;
    case "proc": procesar(); break;
    case "reproc": reprocesar(id); break;
    case "send": { const ids = Object.keys(S.res).filter((x) => S.sel[x]); if (!ids.length) { toast("Procese al menos una campaña seleccionada."); break; } S.dcamp = ids[0]; openModal(draftHTML(ids[0])); break; }
    case "draft": S.dcamp = id; openModal(draftHTML(id)); break;
    case "sent": S.sd[id] = new Date(S.res[id].date); logLine("ok", CAMPS[id].name + ": envío registrado (simulado). «Enviado hasta» actualizado."); $("#mbox").innerHTML = draftHTML(id); render(); break;
    case "conn": P[id].conn = v; saveP(); render(); break;
    case "mode": P[id].mode = v; saveP(); render(); break;
    case "rtab": S.rtab = v; render(); break;
    case "dprev": moveMonth(-1); break;
    case "dnext": moveMonth(1); break;
    case "cal": S.cal = { y: S.date.getFullYear(), m: S.date.getMonth() }; openModal(calHTML()); break;
    case "calprev": S.cal.m--; if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } $("#mbox").innerHTML = calHTML(); break;
    case "calnext": S.cal.m++; if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } $("#mbox").innerHTML = calHTML(); break;
    case "calpick": { const d = new Date(+v); d.setHours(12, 0, 0, 0); S.date = d; closeModal(); render(); break; }
    case "closeM": closeModal(); render(); break;
    case "simul": toast(el.dataset.m); break;
    case "test": toast(CFG.sql.trim() ? "Conexión exitosa (simulada: la demo no se conecta a ninguna base)." : "La cadena de conexión SQL no puede estar vacía."); break;
    case "ptab": S.ptab = v; S.pmsg = ""; render(); break;
    case "ctab": S.ctab = v; render(); break;
    case "prestore": P[S.pcamp] = defP(S.pcamp); saveP(); S.pmsg = "Valores por defecto restaurados."; render(); break;
    case "savepm": saveP(); if (isStale(S.pcamp)) openModal(reprocHTML(S.pcamp)); else { S.pmsg = "Postmortem guardado."; toast("Postmortem guardado."); render(); } break;
    case "reprocyes": closeModal(); reprocesar(id); break;
    case "rmap": openModal(mapHTML(S.pcamp)); break;
    case "addlob": { let n = 1; while (p.lobs.indexOf("LOB nuevo " + n) >= 0) n++; const nm = "LOB nuevo " + n; p.lobs.push(nm); p.qmap[lobQueue(nm, 1)] = nm; p.rmap["Grupo de roster " + (Object.keys(p.rmap).length + 1)] = nm; saveP(); S.pmsg = "LOB agregado."; render(); break; }
    case "dellob": { const i = +el.dataset.i, nm = p.lobs[i]; if (p.lobs.length < 2) break; p.lobs.splice(i, 1); [p.qmap, p.rmap].forEach((m) => Object.keys(m).forEach((k) => { if (m[k] === nm) m[k] = null; })); saveP(); S.pmsg = "LOB eliminado."; render(); break; }
  }
}
function onChange(e) {
  const t = e.target, id = S.pcamp, ds = t.dataset || {};
  if (ds.pp) {
    const path = JSON.parse(ds.pp); let val = t.type === "checkbox" ? t.checked : t.value;
    if (ds.num) { val = parseFloat(String(val).replace(",", ".")); if (!isFinite(val)) { S.pmsg = "Valor numérico inválido."; render(); return; } }
    setPath(P[id], path, val); saveP(); S.pmsg = "Cambio guardado."; render(); return;
  }
  if (ds.lobi != null) {
    const p = P[id], i = +ds.lobi, old = p.lobs[i], nv = t.value.trim();
    if (!nv) { S.pmsg = "El nombre del LOB no puede estar vacío."; render(); return; }
    if (p.lobs.some((l, k) => k !== i && l.toLowerCase() === nv.toLowerCase())) { S.pmsg = "Ya existe un LOB con ese nombre."; render(); return; }
    p.lobs[i] = nv; [p.qmap, p.rmap].forEach((m) => Object.keys(m).forEach((k) => { if (m[k] === old) m[k] = nv; })); saveP(); S.pmsg = "LOB renombrado."; render(); return;
  }
  if (ds.q) { P[id].qmap[ds.q] = t.value === "__none__" ? null : t.value; saveP(); S.pmsg = "Cola reasignada."; render(); return; }
  if (ds.rm) { P[id].rmap[ds.rm] = t.value === "__none__" ? null : t.value; saveP(); toast("Mapeo guardado."); return; }
  if (ds.cfg) { CFG[ds.cfg] = t.value; Object.keys(CAMPS).forEach((k) => { if (!connOk(P[k].conn)) P[k].conn = "Local"; }); saveP(); render(); return; }
  switch (ds.chg) {
    case "pcamp": S.pcamp = t.value; S.pmsg = ""; render(); break;
    case "rcamp": S.rcamp = t.value; render(); break;
    case "dcamp": S.dcamp = t.value; $("#mbox").innerHTML = draftHTML(t.value); break;
    case "lvl": S.lvl = t.value; renderLog(); break;
  }
}

/* ===================== Tooltip semanal ===================== */
let tipT;
function showTip(el, x, y) { const k = el.dataset.wl.split(":"), tip = $("#tip"); tip.innerHTML = weekTip(k[0], +k[1]); tip.style.display = "block"; const w = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 12)) + "px"; tip.style.top = (y + 16) + "px"; }
const hideTip = () => { clearTimeout(tipT); $("#tip").style.display = "none"; };

/* ===================== Arranque ===================== */
function parseHash() {
  const q = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (q.get("th")) S.theme = q.get("th") === "dark" ? "dark" : "light";
  if (q.get("v")) S.view = q.get("v");
  if (q.get("c") && CAMPS[q.get("c")]) S.pcamp = q.get("c");
  if (q.get("t")) { if (S.view === "params") S.ptab = q.get("t"); if (S.view === "config") S.ctab = q.get("t"); }
  if (q.get("rt")) S.rtab = q.get("rt");
  return q;
}
function boot() {
  loadP(); S.date = lastOp(); const q = parseHash();
  document.addEventListener("click", (e) => { if (!e.target.closest("#sb,#burger")) $("#sb").classList.remove("open"); const el = e.target.closest("[data-act]"); if (el && !el.disabled) act(el.dataset.act, el); });
  document.addEventListener("change", onChange);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("ni")) { e.preventDefault(); act("nav", e.target); } });
  document.addEventListener("mouseover", (e) => { const el = e.target.closest ? e.target.closest("[data-wl]") : null; if (!el) return; clearTimeout(tipT); const x = e.clientX, y = e.clientY; tipT = setTimeout(() => showTip(el, x, y), 350); });
  document.addEventListener("mouseout", (e) => { const el = e.target.closest ? e.target.closest("[data-wl]") : null; if (el) hideTip(); });
  document.addEventListener("focusin", (e) => { const el = e.target.closest ? e.target.closest("[data-wl]") : null; if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left, r.bottom - 12); } });
  document.addEventListener("focusout", hideTip);
  $("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
  logLine("step", "Postmortem Hub listo. Demo visual con datos ficticios."); render();
  if (q.get("noauto") == null) { consultar(true); S.sel.A = true; S.sel.E = true; render(); procesar(); }
}
boot();
})();

</script>
</body>
